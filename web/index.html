<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Resolved before the first paint, but from a file: the desktop shell's
         content security policy allows `script-src 'self'` only, so an inline
         copy here would be blocked (or force 'unsafe-inline' on everything).
         A synchronous <script src> in <head> still runs before any paint. -->
    <script src="/theme-init.js"></script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <title>AgentBuddy</title>
    <meta
      name="description"
      content="Desktop workbench for your agents: collaborate in threads, trace tasks, approve work and reach them from anywhere."
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
