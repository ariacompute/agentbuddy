<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Resolve the theme before the first paint so the shell never flashes the
      // wrong grey scale: an explicit choice wins, otherwise default to light.
      try {
        var stored = window.localStorage.getItem('agentbuddy.theme')
        document.documentElement.dataset.theme =
          stored === 'light' || stored === 'dark' ? stored : 'light'
      } catch (error) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <title>agentbuddy</title>
    <meta
      name="description"
      content="Desktop workbench for your agents: collaborate in threads, trace tasks, approve work and reach them from anywhere."
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
