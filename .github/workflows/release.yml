# agentbuddy — build and publish native desktop packages on a tag push.
#
# Each platform runs one self-contained `dotnet publish` for its RID, then wraps
# the output in a native installer plus a portable archive. ab-tool owns every
# release-side contract: version stamping, public-key injection, Ed25519
# (minisign-compatible) signing, WiX authoring, both updater manifests and the
# "exactly nine assets" verification. agenthub is never built or touched here.
#
# Resulting release assets (per version V) — exactly nine files:
#   agentbuddy-amd64-V.deb                native installer, x86_64 Linux
#   agentbuddy-linux-x86_64-V.tar.gz      portable, x86_64 Linux
#   agentbuddy-aarch64-V.dmg              native installer, Apple Silicon macOS
#   agentbuddy-macos-aarch64-V.tar.gz     portable, Apple Silicon macOS (.app)
#   agentbuddy-x64-V.msi                  native installer, x86_64 Windows
#   agentbuddy-windows-x86_64-V.zip       portable, x86_64 Windows
#   latest.json / latest-gitee.json       updater manifests
#   SHA256SUMS                            checksums for the six downloads
#
# There is deliberately NO `.sig` asset and no `updater-*.json` on the release
# page. When UPDATER_PRIVATE_KEY is configured, each leg signs its two downloads
# with `ab-tool sign`; the signature boxes travel in a separate metadata
# artifact and are embedded in the manifests (`platforms` for the installable
# asset, `signatures` for all six). Gitee mirrors upload the same six downloads
# plus `latest-gitee.json` renamed to `latest.json` — one manifest per mirror,
# never a cross-mirror download. With no key configured the client reports
# `not_configured` and never installs an unverified package.
#
# UPDATER_PUBKEY / UPDATER_PRIVATE_KEY hold the minisign key boxes verbatim (the
# two-line text box or its base64 wrapper). `ab-tool inject-pubkey` writes the
# public key into Pubkey.g.cs at build time; no key is ever committed.

name: release

on:
  release:
    types: [published]

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            rid: linux-x64
          - os: macos-latest
            platform: macos
            rid: osx-arm64
          - os: windows-latest
            platform: windows
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: desktop/global.json

      - name: Stamp version and derive icons
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          dotnet run --project desktop/tools/AgentBuddy.Build -- stamp "$VERSION"
          dotnet run --project desktop/tools/AgentBuddy.Build -- icons

      - name: Configure updater signing
        id: updater
        shell: bash
        env:
          UPDATER_PUBKEY: ${{ secrets.UPDATER_PUBKEY }}
          UPDATER_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          dotnet run --project desktop/tools/AgentBuddy.Build -- inject-pubkey
          if [ -n "${UPDATER_PRIVATE_KEY:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish self-contained app
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish desktop/src/AgentBuddy.App/AgentBuddy.App.csproj \
            -c Release -r "${{ matrix.rid }}" --self-contained true \
            -o "$GITHUB_WORKSPACE/publish/${{ matrix.rid }}"

      - name: Package artifacts (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out"; META="$GITHUB_WORKSPACE/meta"
          PUB="$GITHUB_WORKSPACE/publish/${{ matrix.rid }}"
          STAGE="$GITHUB_WORKSPACE/stage"; PORTABLE="$GITHUB_WORKSPACE/portable"
          mkdir -p "$OUT" "$META" "$STAGE/DEBIAN" "$STAGE/usr/lib/agentbuddy" \
                   "$STAGE/usr/bin" "$STAGE/usr/share/applications" \
                   "$STAGE/usr/share/icons/hicolor/256x256/apps" "$PORTABLE/agentbuddy"
          printf 'agentbuddy release metadata\n' > "$META/README.txt"

          sed "s/@VERSION@/$VERSION/" desktop/packaging/linux/control.in > "$STAGE/DEBIAN/control"
          cp -R "$PUB/." "$STAGE/usr/lib/agentbuddy/"
          cp -R "$PUB/." "$PORTABLE/agentbuddy/"
          chmod +x "$STAGE/usr/lib/agentbuddy/agentbuddy" "$PORTABLE/agentbuddy/agentbuddy"
          ln -s ../lib/agentbuddy/agentbuddy "$STAGE/usr/bin/agentbuddy"
          cp desktop/packaging/linux/agentbuddy.desktop "$STAGE/usr/share/applications/"
          cp desktop/src/AgentBuddy.App/Assets/Icons/app-icon.png \
             "$STAGE/usr/share/icons/hicolor/256x256/apps/agentbuddy.png"
          dpkg-deb --build --root-owner-group "$STAGE" "$OUT/agentbuddy-amd64-$VERSION.deb"
          tar -czf "$OUT/agentbuddy-linux-x86_64-$VERSION.tar.gz" -C "$PORTABLE" agentbuddy

          if [ "${{ steps.updater.outputs.enabled }}" = "true" ]; then
            for asset in "$OUT"/agentbuddy-*; do
              dotnet run --project desktop/tools/AgentBuddy.Build -- sign "$asset" \
                --out "$META/$(basename "$asset").sig"
            done
          fi

      - name: Package artifacts (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out"; META="$GITHUB_WORKSPACE/meta"
          PUB="$GITHUB_WORKSPACE/publish/${{ matrix.rid }}"
          STAGE="$GITHUB_WORKSPACE/stage"
          APP="$STAGE/agentbuddy.app"
          mkdir -p "$OUT" "$META" "$APP/Contents/MacOS" "$APP/Contents/Resources"
          printf 'agentbuddy release metadata\n' > "$META/README.txt"
          cp -R "$PUB/." "$APP/Contents/MacOS/"
          sed "s/@VERSION@/$VERSION/" desktop/packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          cp desktop/src/AgentBuddy.App/Assets/Icons/app.icns "$APP/Contents/Resources/app.icns"
          chmod +x "$APP/Contents/MacOS/agentbuddy"
          hdiutil create -volname agentbuddy -srcfolder "$APP" -ov -format UDZO \
            "$OUT/agentbuddy-aarch64-$VERSION.dmg"
          tar -czf "$OUT/agentbuddy-macos-aarch64-$VERSION.tar.gz" -C "$STAGE" agentbuddy.app

          if [ "${{ steps.updater.outputs.enabled }}" = "true" ]; then
            for asset in "$OUT"/agentbuddy-*; do
              dotnet run --project desktop/tools/AgentBuddy.Build -- sign "$asset" \
                --out "$META/$(basename "$asset").sig"
            done
          fi

      - name: Package artifacts (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          $OUT = "$env:GITHUB_WORKSPACE/out"
          $META = "$env:GITHUB_WORKSPACE/meta"
          $PUB = "$env:GITHUB_WORKSPACE/publish/${{ matrix.rid }}"
          $TOOLS = "$env:GITHUB_WORKSPACE/.tools"
          New-Item -ItemType Directory -Force -Path $OUT, $META, $TOOLS | Out-Null
          Set-Content -Path (Join-Path $META "README.txt") -Value "agentbuddy release metadata"

          $msiVersion = ($env:VERSION -split '-')[0]
          dotnet tool install --tool-path $TOOLS wix --version 4.0.6
          dotnet run --project desktop/tools/AgentBuddy.Build -- wix --dir $PUB --out "$TOOLS/Product.wxs"
          & "$TOOLS/wix.exe" build -arch x64 -d "Version=$msiVersion" "$TOOLS/Product.wxs" `
            -o "$OUT/agentbuddy-x64-$($env:VERSION).msi"

          Compress-Archive -Path "$PUB/*" -DestinationPath "$OUT/agentbuddy-windows-x86_64-$($env:VERSION).zip"
          if ("${{ steps.updater.outputs.enabled }}" -eq "true") {
            Get-ChildItem "$OUT/agentbuddy-*" | ForEach-Object {
              dotnet run --project desktop/tools/AgentBuddy.Build -- sign $_.FullName `
                --out (Join-Path $META ($_.Name + ".sig"))
              if ($LASTEXITCODE -ne 0) { throw "signing failed for $($_.Name)" }
            }
          }

      # Publishable downloads and signature metadata travel in separate artifacts,
      # so `.sig` files can never become release assets.
      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: agentbuddy-assets-${{ matrix.platform }}
          path: out
          if-no-files-found: error
      - name: Upload internal metadata
        uses: actions/upload-artifact@v4
        with:
          name: agentbuddy-meta-${{ matrix.platform }}
          path: meta
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: desktop/global.json
      - uses: actions/download-artifact@v4
        with:
          pattern: agentbuddy-assets-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: agentbuddy-meta-*
          path: release-meta
          merge-multiple: true
      - name: List assets
        run: ls -lh release-assets
      - name: Generate updater manifests
        shell: bash
        env:
          RELEASE_NOTES: ${{ github.event.release.body }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet run --project desktop/tools/AgentBuddy.Build -- manifest \
            --version "$VERSION" --meta release-meta --out release-assets
      - name: Gitee mirror checklist
        continue-on-error: true
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if curl -fsS --max-time 20 \
            "https://gitee.com/api/v5/repos/ariacompute/agentbuddy/releases/tags/$TAG" >/dev/null; then
            echo "Gitee release $TAG is present."
          else
            echo "::warning::Gitee release $TAG is missing or unreachable; mirror it manually."
          fi
          echo "### Gitee mirror" >> "$GITHUB_STEP_SUMMARY"
          echo "Upload the six \`agentbuddy-*\` downloads and \`latest-gitee.json\` renamed to \`latest.json\` to the Gitee release for $TAG. Signatures are embedded in the manifest; no \`.sig\` files are needed." >> "$GITHUB_STEP_SUMMARY"
      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum agentbuddy-* > SHA256SUMS
          cat SHA256SUMS
      - name: Verify release assets
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet run --project desktop/tools/AgentBuddy.Build -- verify release-assets "$VERSION"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.ARIACOMPUTE_TOKEN }}
          # An explicit allowlist on top of the verify step: even a stray file in
          # release-assets/ can never become a release asset.
          files: |
            release-assets/agentbuddy-amd64-*.deb
            release-assets/agentbuddy-linux-x86_64-*.tar.gz
            release-assets/agentbuddy-aarch64-*.dmg
            release-assets/agentbuddy-macos-aarch64-*.tar.gz
            release-assets/agentbuddy-x64-*.msi
            release-assets/agentbuddy-windows-x86_64-*.zip
            release-assets/latest.json
            release-assets/latest-gitee.json
            release-assets/SHA256SUMS
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
