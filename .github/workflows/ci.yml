# agentbuddy — continuous integration.
#
# One .NET 10 solution replaces the old two-job web/desktop split. Every job runs
# the full suite: Core, Shell (including the real-socket loopback gateway smoke),
# App (Avalonia.Headless ViewModel + navigation guards) and the static guards
# (13-language parity, monochrome XAML, frozen endpoint reachability, release
# contract). Icons are derived first because the app embeds them as AvaloniaResource.
#
# Coverage is collected with coverlet (Cobertura) and summarized into the job log;
# the static guards are the hard gate, so an untranslated key or a chromatic
# colour fails the build even when line coverage happens to stay high.

name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  dotnet:
    name: dotnet — ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: desktop/global.json

      - name: Restore
        run: dotnet restore desktop/agentbuddy.sln

      - name: Derive icons from the single source
        run: dotnet run --project desktop/tools/AgentBuddy.Build -- icons

      - name: Build (warnings are errors)
        run: dotnet build desktop/agentbuddy.sln --no-restore -warnaserror

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          dotnet test desktop/agentbuddy.sln --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory coverage \
            --logger "console;verbosity=normal" 2>&1 | tee dotnet-test.log

      - name: Publish the test summary
        if: always()
        shell: bash
        run: |
          {
            echo "### dotnet test (${{ matrix.os }})"
            echo '```'
            grep -E '^(Passed!|Failed!|已通过!|失败!)' dotnet-test.log || true
            echo '```'
            echo 'Coverage (Cobertura):'
            find coverage -name 'coverage.cobertura.xml' -print | sort || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage and test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: |
            coverage/**/coverage.cobertura.xml
            dotnet-test.log
          if-no-files-found: warn
