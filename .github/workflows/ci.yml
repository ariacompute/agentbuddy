# agentbuddy — continuous integration.
#
# Five jobs. The first three mirror the offline `make test` targets:
#   • web      → Vitest suite (bun) under web/  (tests/style.spec.js monochrome
#                guard, copy-fallback 13-language completeness, smoke.e2e.spec.js)
#   • scripts  → Vitest suite (bun) under desktop/ for the release-time scripts
#                (icon encoder, version stamp, signing secrets, latest.json) —
#                no Rust toolchain needed, so it stays a one-minute job
#   • desktop  → `cargo test` under desktop/src-tauri
#   • e2e      → desktop/e2e: drives the real debug desktop binary through
#                tauri-driver + WebKitWebDriver against a deterministic stub.
#                Linux only: this is the authoritative full run; on Windows the
#                Tauri native test entry cannot launch (see AGENTS.md). The job
#                also sets E2E_REQUIRE_DESKTOP=1, so a run where preflight
#                skipped every desktop suite fails instead of reporting green.
#   • contract-live → checks out agenthub, starts it against a postgres:16
#                service, and runs the cross-repo error contract with
#                E2E_BACKEND=live E2E_CONTRACT_ONLY=1. No WebDriver, no binary:
#                the contract is plain HTTP. A drift in a status or a machine
#                code now fails here instead of waiting for a manual audit.
#
# The desktop crate embeds the console via rust-embed and calls
# `tauri::generate_context!`, which reads desktop/src-tauri/icons/ at compile
# time. That directory is git-ignored, so icons must be re-derived (bun run
# icons) before cargo can compile — otherwise even `cargo check` fails.
# On Windows the Tauri native test entry cannot launch, so the matrix drops to
# `cargo test --no-run` (compile-only), matching the AGENTS.md guidance.
#
# Both compile jobs first assert the updater public key's cross-file contract
# (upgrade/mod.rs ↔ tauri.conf.json). The published summaries carry the run URL,
# commit and attempt, so a "verified" claim in task.md can be traced back to the
# exact job instead of being a claim of its own.

name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# One CI run per ref; a newer push cancels an in-progress one so results are
# never a mix of two commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ----------------------------------------------------------------- web (Vitest)
  web:
    name: web — vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install

      - name: Vitest (unit + style/monochrome + copy-fallback guards)
        run: bun run test

      - name: Vitest coverage (v8 text report)
        run: bun run test:coverage

  # ------------------------------------------- desktop scripts (Vitest, no Rust)
  scripts:
    name: desktop scripts — vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Vitest (icon set, version stamp, signing secrets, release manifests)
        run: bun run test

      - name: Vitest coverage (v8 text report over scripts/)
        run: bun run test:coverage

  # -------------------------------------------------------------- desktop (cargo)
  desktop:
    name: desktop — cargo test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            command: cargo test
          - os: windows-latest
            # Tauri native test entry cannot launch on Windows CI; compile only.
            command: cargo test --no-run
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev build-essential curl wget file

      - name: Derive icons (git-ignored; required to compile)
        working-directory: desktop
        shell: bash
        run: |
          bun install
          bun run icons

      # The console is embedded at compile time (rust-embed over ../../web/dist).
      # Without it, the two static-file cases in the proxy suites take their
      # "bundle not built" skip branch — they pass, but they prove nothing.
      - name: Build the workbench bundle
        working-directory: web
        shell: bash
        run: |
          bun install --frozen-lockfile
          bun run build

      # Cross-file contract: the release workflow writes the same key into both
      # upgrade/mod.rs and tauri.conf.json. In the committed tree both must stay
      # empty, so a change that touches only one of them fails before compiling.
      - name: Assert updater pubkey contract
        shell: bash
        run: node desktop/scripts/verify-updater-pubkey.mjs

      # Linux really runs the suite; the log is kept so the summary below (and a
      # failed job) can be read without scrolling through the step output.
      - name: Cargo test (Linux, with log)
        if: matrix.os == 'ubuntu-22.04'
        working-directory: desktop/src-tauri
        shell: bash
        run: |
          set -o pipefail
          cargo test 2>&1 | tee desktop-test.log

      # Windows CI cannot start the Tauri native test binary, so it compiles only.
      - name: Cargo test (Windows, compile only)
        if: matrix.os != 'ubuntu-22.04'
        working-directory: desktop/src-tauri
        run: ${{ matrix.command }}

      - name: Publish the desktop test summary
        if: matrix.os == 'ubuntu-22.04'
        working-directory: desktop/src-tauri
        shell: bash
        run: |
          {
            echo '### cargo test (Linux)'
            echo
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT})"
            echo "commit: ${GITHUB_SHA}"
            echo "job: ${GITHUB_JOB}"
            echo
            echo '```'
            grep -E '^(running [0-9]+ tests|test result:)' desktop-test.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the desktop test log
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-log
          path: desktop/src-tauri/desktop-test.log
          if-no-files-found: error

  # ------------------------------------------- desktop app E2E (tauri-driver)
  e2e:
    name: desktop — user-journey E2E
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # WebKitWebDriver is the platform driver tauri-driver talks to; xvfb gives
      # WebKitGTK a display without a physical desktop.
      - name: Linux build and WebDriver dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev build-essential \
            curl wget file webkit2gtk-driver xvfb

      - name: Install tauri-driver
        shell: bash
        run: cargo install tauri-driver --locked

      - name: Install JS dependencies and derive icons
        shell: bash
        run: |
          (cd web && bun install --frozen-lockfile)
          (cd desktop && bun install --frozen-lockfile && bun run icons)

      # rust-embed reads ../../web/dist at compile time, so the workbench must
      # be built before the desktop binary.
      - name: Build the workbench bundle
        working-directory: web
        shell: bash
        run: bun run build

      - name: Assert updater pubkey contract
        shell: bash
        run: node desktop/scripts/verify-updater-pubkey.mjs

      - name: Build the debug desktop binary with the E2E isolation seam
        working-directory: desktop/src-tauri
        shell: bash
        run: cargo build --features e2e-isolation

      - name: Unit-test the isolation seam (both paths)
        working-directory: desktop/src-tauri
        shell: bash
        run: cargo test --features e2e-isolation e2e_config_dir

      - name: Run the user journeys
        working-directory: desktop
        shell: bash
        run: bun run test:e2e
        env:
          E2E_APP_BIN: ${{ github.workspace }}/desktop/src-tauri/target/debug/AgentBuddy
          # Linux is the authoritative platform, and every desktop suite is
          # describe.skipIf(info.skipped): without this, a preflight failure
          # would skip them all and still exit 0. A skip is a failure here.
          E2E_REQUIRE_DESKTOP: "1"

      - name: Publish the E2E summary
        if: always()
        shell: bash
        run: |
          {
            echo '### desktop E2E'
            echo
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT})"
            echo "commit: ${GITHUB_SHA}"
            echo "job: ${GITHUB_JOB}"
            echo
            echo "platform: linux (authoritative); E2E_REQUIRE_DESKTOP=1 — a skipped run fails the job"
            echo
            echo '```'
            cat desktop/e2e/artifacts/run.json 2>/dev/null || echo 'no run.json produced'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload E2E artefacts (report, failure screenshots, request log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-artifacts
          path: desktop/e2e/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  # ------------------------------- cross-repo error contract (real agenthub)
  contract-live:
    name: desktop — live agenthub contract
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agenthub
          POSTGRES_PASSWORD: agenthub
          POSTGRES_DB: agenthub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenthub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://agenthub:agenthub@127.0.0.1:5432/agenthub?sslmode=disable
      AGENTHUB_ENV: dev
      AGENTHUB_HTTP_PORT: "3500"
      AGENTHUB_BOOTSTRAP_ADMIN_EMAIL: contract@example.test
      AGENTHUB_BOOTSTRAP_ADMIN_PASSWORD: agenthub-contract-pass
      AGENTHUB_BOOTSTRAP_ADMIN_NAME: Contract Admin
      E2E_BACKEND: live
      E2E_SERVER_URL: http://127.0.0.1:3500
      E2E_LIVE_EMAIL: contract@example.test
      E2E_LIVE_PASSWORD: agenthub-contract-pass
      E2E_CONTRACT_ONLY: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Check out agenthub (the server this contract is written against)
        uses: actions/checkout@v4
        with:
          repository: ariacompute/agenthub
          ref: main
          path: agenthub

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: agenthub/go.sum

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Build agenthub
        working-directory: agenthub
        shell: bash
        run: |
          mkdir -p bin
          go build -o bin/agenthub-server ./cmd/agenthub-server

      - name: Start agenthub and wait for /healthz
        working-directory: agenthub
        shell: bash
        run: |
          set -euo pipefail
          ./bin/agenthub-server > server.log 2>&1 &
          echo $! > server.pid
          for attempt in $(seq 1 90); do
            if curl -fsS "http://127.0.0.1:${AGENTHUB_HTTP_PORT}/healthz" >/dev/null; then
              echo "agenthub answered /healthz after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "agenthub did not become healthy in 90s; server.log follows" >&2
          cat server.log >&2
          exit 1

      - name: Install the E2E dependencies
        working-directory: desktop
        shell: bash
        run: bun install --frozen-lockfile

      - name: Run the cross-repo contract against real agenthub
        working-directory: desktop
        shell: bash
        run: bun run test:e2e

      - name: Publish the live contract summary
        if: always()
        shell: bash
        run: |
          {
            echo '### live agenthub contract'
            echo
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT})"
            echo "commit: ${GITHUB_SHA}"
            echo "job: ${GITHUB_JOB}"
            echo "server: ariacompute/agenthub@main, ${E2E_SERVER_URL}"
            echo
            echo '```'
            cat desktop/e2e/artifacts/run.json 2>/dev/null || echo 'no run.json produced'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the live contract artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-contract-artifacts
          path: |
            desktop/e2e/artifacts/
            agenthub/server.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop agenthub
        if: always()
        working-directory: agenthub
        shell: bash
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" 2>/dev/null || true
          fi
